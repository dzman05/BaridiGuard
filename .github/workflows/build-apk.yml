name: Build BaridiGuard Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Accept Licenses & Install Android SDK 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build Debug APK & Google Play App Bundle (AAB)
        working-directory: ./android-app
        run: |
          gradle assembleDebug bundleDebug --stacktrace

      - name: Copy & Rename Outputs
        run: |
          mkdir -p release-output
          cp android-app/app/build/outputs/apk/debug/app-debug.apk release-output/BaridiGuard-v1.0.0.apk
          cp android-app/app/build/outputs/bundle/debug/app-debug.aab release-output/BaridiGuard-v1.0.0.aab

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BaridiGuard-v1.0.0-Package
          path: release-output/*
          retention-days: 30

      - name: Create GitHub Release with APK and AAB
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "BaridiGuard v1.0.0 - حارس بريدي (Official Release)"
          body: |
            ## 🛡️ BaridiGuard v1.0.0 - حارس بريدي (الإصدار الرسمي الشامل)
            
            ### ✨ ميزات الإصدار 1.0.0 (Version Officielle 1.0.0):
            - 🔒 **حماية محلية 100% بدون اتصال خارجي (Zero Data Collection / 100% Offline)**:
              التطبيق لا يتصل بأي سيرفر ولا يرسل أي معلومة إطلاقاً خارج الهاتف.
            - 🚨 **رادار كشف تشغيل تطبيق بريدي موب الرسمي (`ru.bpc.mobilebank.bpc`)**.
            - 📩 **خزنة أكواد التأكيد (OTP Vault) بأسبقية قصوى (Priority 999)** لمنع الحذف الخفي بواسطة التروجان.
            - 🛑 **كاشف الشاشة السوداء والتراكب الخبيث** ("جاري تحديث الهاتف...").
            - ⚡ **قاطع الإنترنت الطارئ (Kill-Switch)** لعزل الهاتف فوراً.
            - 🛡️ **درع الحماية الذاتية ومسؤول الجهاز (Anti-Kill)** ضد الحذف القسري.
            - 📦 **حزمة Google Play الرسمية (`BaridiGuard-v1.0.0.aab`)** جاهزة للرفع على المتجر.
            - 📱 **ملف APK للتثبيت المباشر (`BaridiGuard-v1.0.0.apk`)**.
          files: |
            release-output/BaridiGuard-v1.0.0.apk
            release-output/BaridiGuard-v1.0.0.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
