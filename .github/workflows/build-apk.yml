name: Build BaridiGuard Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Accept Licenses & Install Android SDK 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build Debug APK
        working-directory: ./android-app
        run: |
          gradle assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p release-output
          cp android-app/app/build/outputs/apk/debug/app-debug.apk release-output/BaridiGuard-v1.2.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaridiGuard-v1.2-APK
          path: release-output/BaridiGuard-v1.2.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "BaridiGuard v1.2.0 (BaridiMob Launch Alarm Guardian)"
          body: |
            ## 🛡️ BaridiGuard v1.2.0 - حارس بريدي (رادار إنذار بريدي موب)
            
            ### ✨ الجديد والمهم في هذا الإصدار (Nouveautés majeures):
            - 🚨 **إنذار فوري عند فتح بريدي موب (Alarme ouverture BaridiMob)**:
              حتى لو كان الهاتف شغالاً بيد الضحية أو يتحكم به فيروس خلسة وراء شاشة سوداء؛ بمجرد تشغيل تطبيق `dz.poste.baridimob`، يطلق حارس بريدي صفارة إنذار أمنية قوية وإشعاراً عاجلاً لتنبيه الضحية فوراً لمنع سرقة الرصيد.
            - 🔘 **زر اختبار صفارة بريدي موب (Bouton Test Alarme)**: في الواجهة الرئيسية لتجربة الصوت والإشعار مباشرة.
            - 🌐 **تفعيل إذن رادار الاستخدام (Accès à l'utilisation)**: بنقرة واحدة لتمكين الهاتف من رصد التطبيقات البنكية لحظياً.
            - 🇩🇿 **دعم اللغتين العربية والفرنسية بالكامل**: مع زر تبديل فوري في الشريط العلوي.
            - ⚡ **قاطع الإنترنت التلقائي وعزل الهاتف**: لقطع تواصل التروجان مع سيرفر المخترقين.
          files: release-output/BaridiGuard-v1.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
