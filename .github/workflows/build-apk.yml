name: Build BaridiGuard Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Accept Licenses & Install Android SDK 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build Debug APK
        working-directory: ./android-app
        run: |
          gradle assembleDebug --stacktrace > ../build.log 2>&1 || true

      - name: Push Log to GitHub Branch for Inspection
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-log
          tail -n 80 build.log > build-summary.txt
          git add build-summary.txt
          git commit -m "build log summary" || true
          git push -f origin debug-log || true
          grep "BUILD SUCCESSFUL" build.log || exit 1

      - name: Copy & Rename APK
        run: |
          mkdir -p release-output
          cp android-app/app/build/outputs/apk/debug/app-debug.apk release-output/BaridiGuard-v1.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaridiGuard-v1.0-APK
          path: release-output/BaridiGuard-v1.0.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "BaridiGuard v1.0.0 (Official APK)"
          body: |
            ## 🛡️ BaridiGuard v1.0.0 - حارس بريدي
            
            تطبيق الحماية الاستباقية لتطبيق **BaridiMob** والبطاقة الذهبية في الجزائر.
          files: release-output/BaridiGuard-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
