name: Build BaridiGuard Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Accept Licenses & Install Android SDK 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build Debug APK
        working-directory: ./android-app
        run: |
          gradle assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p release-output
          cp android-app/app/build/outputs/apk/debug/app-debug.apk release-output/BaridiGuard-v1.1.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaridiGuard-v1.1-APK
          path: release-output/BaridiGuard-v1.1.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "BaridiGuard v1.1.0 (Official Update)"
          body: |
            ## 🛡️ BaridiGuard v1.1.0 - حارس بريدي (Mise à jour)
            
            ### ✨ الجديد في هذا التحديث (Nouveautés):
            - 🌐 **زر تبديل اللغة المباشر [ 🇩🇿 AR / 🇫🇷 FR ]**: داخل التطبيق مع ترجمة فرنسية وعربية كاملة وتغيير اتجاه الشاشة (RTL/LTR).
            - ⚡ **إصلاح قاطع الإنترنت على هواتف أندرويد الحديثة (Android 10 - 15)**: إطلاق نافذة قطع الشبكة الفورية وعزل التروجان مع صوت الإنذار.
            - 🎨 **الأيقونة الرسمية عالية الدقة**: مطابقة تماماً لشعار الدرك السيبراني والبطاقة الذهبية داخل وخارج التطبيق.
          files: release-output/BaridiGuard-v1.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
