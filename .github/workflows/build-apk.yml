name: Build BaridiGuard Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Accept Licenses & Install Android SDK 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build Debug APK
        working-directory: ./android-app
        run: |
          gradle assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p release-output
          cp android-app/app/build/outputs/apk/debug/app-debug.apk release-output/BaridiGuard-v1.2.3.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaridiGuard-v1.2.3-APK
          path: release-output/BaridiGuard-v1.2.3.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.3
          name: "BaridiGuard v1.2.3 (Accessibility Quick-Activation & In-App Launch Tester)"
          body: |
            ## 🛡️ BaridiGuard v1.2.3 - حارس بريدي (تفعيل الحراسة الفورية واختبار الفتح)
            
            ### ✨ الجديد في هذا التحديث (Nouveautés v1.2.3):
            - 🚀 **زر تفعيل الحراسة الفورية في إمكانية الوصول (Accessibilité)**:
              تفعيل خدمة BaridiGuard بنقرة واحدة لتمكين الهاتف من رصد تطبيق بريدي موب فورياً دون استهلاك للبطارية.
            - 📱 **زر فتح بريدي موب المباشر للاختبار**:
              زر مدمج لتشغيل بريدي موب من داخل حارس بريدي لمشاهدة إطلاق الإنذار تلقائياً في ثانية واحدة.
            - 🔔 **طلب إذن الإشعارات لأندرويد 13 فما فوق**: لضمان عدم حجب التنبيهات من طرف النظام.
            - 🛑 **إيقاف الإنذار التلقائي واليدوي وأيقونات FontAwesome**.
          files: release-output/BaridiGuard-v1.2.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
