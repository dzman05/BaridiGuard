name: Build BaridiGuard Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Accept Licenses & Install Android SDK 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build Debug APK
        working-directory: ./android-app
        run: |
          gradle assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p release-output
          cp android-app/app/build/outputs/apk/debug/app-debug.apk release-output/BaridiGuard-v1.3.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaridiGuard-v1.3.0-APK
          path: release-output/BaridiGuard-v1.3.0.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "BaridiGuard v1.3.0 (OTP Vault, One-Tap Shield Activator & Full Defense Suite)"
          body: |
            ## 🛡️ BaridiGuard v1.3.0 - حارس بريدي (الدرع الشامل، معالج التفعيل السريع وخزنة OTP)
            
            ### ✨ الجديد والأساسي في هذا الإصدار الشامل (Nouveautés v1.3.0):
            - 📩 **خزنة الرسائل وأكواد التأكيد (OTP Vault) بأسبقية قصوى (Priority 999)**:
              حفظ نسخة مشفرة ومستقلة لرسائل بريد الجزائر لمنع الفيروس من حذفها خفية، مع زر نسخ فوري واختبار المحاكاة.
            - ⚡ **معالج التفعيل والتسطيب السريع (One-Tap Shield Activator 1-2-3-4)**:
              إرشاد خطوة بخطوة لجميع المستخدمين لتفعيل الصلاحيات وحل مشكلة الإعدادات المقيدة والشفافة (Paramètres restreints في أندرويد 13/14).
            - 🎯 **رصد وتشغيل تطبيق بريدي موب الرسمي من متجر جوجل (`ru.bpc.mobilebank.bpc`)**.
            - 🛡️ **تفعيل دروع الحماية الـ 5 كاملة**:
              1. رادار تشغيل بريدي موب
              2. خزنة تأكيد الرسائل OTP ومنع حذفها
              3. كاشف الشاشة السوداء والتراكب الخبيث ("يتم تحديث الهاتف...")
              4. قاطع الإنترنت التلقائي (Kill-Switch)
              5. درع الحماية الذاتية ومسؤول الجهاز (Anti-Kill Device Admin)
            - 🛑 **إيقاف صفارة الإنذار التلقائي (3.5 ثوانٍ) واليدوي الفوري**.
          files: release-output/BaridiGuard-v1.3.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
