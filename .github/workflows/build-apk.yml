name: Build BaridiGuard Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Accept Licenses & Install Android SDK 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build Debug APK
        working-directory: ./android-app
        run: |
          gradle assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p release-output
          cp android-app/app/build/outputs/apk/debug/app-debug.apk release-output/BaridiGuard-v1.2.2.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaridiGuard-v1.2.2-APK
          path: release-output/BaridiGuard-v1.2.2.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.2
          name: "BaridiGuard v1.2.2 (Smart Auto-Stop Alarm & One-Time Launch Guardian)"
          body: |
            ## 🛡️ BaridiGuard v1.2.2 - حارس بريدي (إيقاف الإنذار التلقائي واليدوي)
            
            ### ✨ الجديد في هذا التحديث (Nouveautés v1.2.2):
            - ⏱️ **إيقاف الإنذار التلقائي (Auto-Stop après 3.5s)**:
              توقف صفارة الإنذار تلقائياً بعد 3.5 ثوانٍ دون الاستمرار اللانهائي.
            - 🛑 **زر إيقاف الإنذار الفوري (Bouton Arrêt Immédiat)**:
              ظهور زر أحمر بارز في الواجهة الرئيسية لإسكات الإنذار فوراً بنقرة واحدة عند الرغبة.
            - 🎯 **منع تكرار الإنذار أثناء استخدام بريدي موب**:
              يطلق الإنذار مرة واحدة فقط عند فتح التطبيق، ولا يتكرر أثناء تنقل المستخدم داخل بريدي موب.
            - 🎨 **أيقونات FontAwesome وتضمين بريدي ويب الرسمي**.
          files: release-output/BaridiGuard-v1.2.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
