name: Build BaridiGuard Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Accept Licenses & Install Android SDK 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build Debug APK & Google Play App Bundle (AAB)
        working-directory: ./android-app
        run: |
          gradle assembleDebug bundleDebug --stacktrace

      - name: Copy & Rename Outputs
        run: |
          mkdir -p release-output
          cp android-app/app/build/outputs/apk/debug/app-debug.apk release-output/BaridiGuard-v1.3.1.apk
          cp android-app/app/build/outputs/bundle/debug/app-debug.aab release-output/BaridiGuard-v1.3.1.aab

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BaridiGuard-v1.3.1-Package
          path: release-output/*
          retention-days: 30

      - name: Create GitHub Release with APK and AAB
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1
          name: "BaridiGuard v1.3.1 (Google Play Compliance, Prominent Disclosures & App Bundle AAB)"
          body: |
            ## 🛡️ BaridiGuard v1.3.1 - متوافق بالكامل مع معايير Google Play ومتطلبات النشر
            
            ### ✨ الجديد في هذا الإصدار (Google Play Compliance):
            - 📦 **توفير حزمة Google Play الرسمية (`BaridiGuard-v1.3.1.aab`)**:
              جاهزة مباشرة للرفع على متجر Google Play Console بصيغة Android App Bundle.
            - 📜 **الإفصاح البارز الإلزامي (In-App Prominent Disclosures)**:
              شاشات إفصاح مسبقة قبل طلب صلاحية إمكانية الوصول (Accessibility)، والرسائل (SMS OTP)، ومسؤول الجهاز (Device Admin).
            - ⚖️ **إخلاء المسؤولية القانوني وعدم انتحال الصفة (Non-Affiliation Disclaimer)**:
              توضيح رسمي صريح داخل التطبيق بأنه أداة أمنية سيبرانية مستقلة لحماية المواطنين، غير تابعة لبريد الجزائر.
            - 🌐 **رابط سياسة الخصوصية الحي والمعتمد (Privacy Policy)**:
              منشور ومتاح عبر `privacy-policy.html` على GitHub لربطه في لوحة تحكم المتجر.
            - 📱 **ملف APK للمستخدمين العاديين (`BaridiGuard-v1.3.1.apk`)** للتثبيت المباشر.
          files: |
            release-output/BaridiGuard-v1.3.1.apk
            release-output/BaridiGuard-v1.3.1.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
