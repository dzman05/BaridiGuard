<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="logoShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="logoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Icon Emblem (Scale & Positioned) -->
  <g transform="translate(40, 20) scale(0.39)">
    <!-- Squircle Plate -->
    <rect width="512" height="512" rx="112" fill="#0b132b" stroke="#10b981" stroke-width="6"/>
    
    <!-- Shield -->
    <path d="M 256,60 L 396,115 C 396,255 330,375 256,430 C 182,375 116,255 116,115 Z" 
          fill="#0f172a" stroke="url(#logoShieldGrad)" stroke-width="14"/>
    <path d="M 256,82 L 376,130 C 376,245 320,350 256,398 C 192,350 136,245 136,130 Z" 
          fill="url(#logoShieldGrad)" fill-opacity="0.18" stroke="#34d399" stroke-width="3"/>

    <!-- Golden Card -->
    <rect x="186" y="180" width="140" height="95" rx="14" fill="url(#logoGoldGrad)" stroke="#fef08a" stroke-width="3"/>
    <rect x="202" y="205" width="28" height="22" rx="4" fill="#78350f" opacity="0.8"/>
    
    <!-- Glowing Lock -->
    <g transform="translate(256, 265)">
      <path d="M -22,-20 C -22,-44 22,-44 22,-20 L 22,-6 L -22,-6 Z" 
            fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
      <rect x="-34" y="-8" width="68" height="54" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="5"/>
      <circle cx="0" cy="14" r="7" fill="#10b981"/>
    </g>
  </g>

  <!-- Typography Right (Multilingual: Arabic & English) -->
  <g transform="translate(280, 0)">
    <!-- English Tech Title -->
    <text x="0" y="85" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-weight="900" font-size="56" fill="#ffffff" letter-spacing="1">
      BARIDI<tspan fill="#10b981">GUARD</tspan>
    </text>

    <!-- Arabic Badge / Sub-heading -->
    <g transform="translate(0, 105)">
      <!-- Pill Badge -->
      <rect x="0" y="0" width="165" height="32" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
      <text x="82" y="21" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-weight="bold" font-size="16" fill="#34d399" text-anchor="middle">
        🛡️ حارس بريدي الذكي
      </text>

      <text x="185" y="22" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-weight="600" font-size="15" fill="#f59e0b">
        • درع الحماية المالية ومكافحة التروجانات
      </text>
    </g>

    <!-- Description / Purpose Line in Arabic -->
    <text x="0" y="172" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-weight="normal" font-size="15" fill="#94a3b8">
      كشف هجمات الشاشة السوداء • حماية رموز OTP • رصد برمجيات التجسس في أندرويد
    </text>

    <!-- Version & Tag -->
    <text x="0" y="202" font-family="monospace" font-size="13" fill="#64748b">
      v1.0.0 Pro • Zero-Trust Mobile Security Framework for Algeria
    </text>
  </g>
</svg>