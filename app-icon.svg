<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="40%" stop-color="#0f2942"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Shield Primary Gradient (Emerald to Cyan Cyber) -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Golden Postal / Edahabia Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Circuit Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle App Container (Android 512x512 standard) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Subtle Border -->
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Cyber Grid Lines (Faint Background) -->
  <g opacity="0.08" stroke="#10b981" stroke-width="1.5">
    <line x1="64" y1="0" x2="64" y2="512"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="192" y1="0" x2="192" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="320" y1="0" x2="320" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="448" y1="0" x2="448" y2="512"/>
    <line x1="0" y1="64" x2="512" y2="64"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="192" x2="512" y2="192"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="320" x2="512" y2="320"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="0" y1="448" x2="512" y2="448"/>
  </g>

  <!-- Glowing Radar Concentric Circles -->
  <circle cx="256" cy="245" r="170" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="6,6"/>
  <circle cx="256" cy="245" r="210" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.1"/>

  <!-- Main Security Shield Shadow & Geometry -->
  <g filter="url(#dropShadow)">
    <!-- Outer Shield Frame -->
    <path d="M 256,60 L 396,115 C 396,255 330,375 256,430 C 182,375 116,255 116,115 Z" 
          fill="#0f172a" 
          stroke="url(#shieldGrad)" 
          stroke-width="10"/>

    <!-- Inner Shield Inset -->
    <path d="M 256,82 L 376,130 C 376,245 320,350 256,398 C 192,350 136,245 136,130 Z" 
          fill="url(#shieldGrad)" 
          fill-opacity="0.15" 
          stroke="#34d399" 
          stroke-width="2" 
          stroke-opacity="0.5"/>

    <!-- Inner Core Dark Plate -->
    <path d="M 256,102 L 356,144 C 356,235 310,325 256,368 C 202,325 156,235 156,144 Z" 
          fill="#0b1329"/>
  </g>

  <!-- Biometric Fingerprint / Digital Rings (Stylized inside Shield) -->
  <g stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.35">
    <path d="M 230,195 A 30,30 0 0,1 282,195"/>
    <path d="M 220,215 A 42,42 0 0,1 292,215"/>
    <path d="M 212,235 A 54,54 0 0,1 300,235"/>
    <path d="M 205,255 A 66,66 0 0,1 307,255"/>
  </g>

  <!-- Central Symbol: Golden Smart-Card / Postal Security Vault with Laser Lock -->
  <g filter="url(#dropShadow)">
    <!-- Golden Edahabia / Baridi Postal Card Shape -->
    <rect x="186" y="180" width="140" height="95" rx="14" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="2.5"/>
    
    <!-- Card Chip / Microcontroller Lines -->
    <rect x="202" y="205" width="28" height="22" rx="4" fill="#78350f" opacity="0.8"/>
    <line x1="202" y1="216" x2="230" y2="216" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="216" y1="205" x2="216" y2="227" stroke="#fbbf24" stroke-width="1.5"/>

    <!-- Card Signal / Contactless Waves -->
    <path d="M 300,205 A 14,14 0 0,1 300,225" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 307,200 A 22,22 0 0,1 307,230" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Prominent Glowing Padlock Over the Card (The Fortress) -->
    <g transform="translate(256, 265)">
      <!-- Shackle -->
      <path d="M -22,-20 C -22,-44 22,-44 22,-20 L 22,-6 L -22,-6 Z" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="8" 
            stroke-linecap="round"
            filter="url(#neonGlow)"/>
      <path d="M -22,-20 C -22,-44 22,-44 22,-20 L 22,-6 L -22,-6 Z" 
            fill="none" 
            stroke="#10b981" 
            stroke-width="7" 
            stroke-linecap="round"/>

      <!-- Lock Body -->
      <rect x="-34" y="-8" width="68" height="54" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="4"/>
      
      <!-- Keyhole with Emerald Pulse -->
      <circle cx="0" cy="14" r="7" fill="#10b981"/>
      <polygon points="-4,16 4,16 6,28 -6,28" fill="#10b981"/>
      <circle cx="0" cy="14" r="3" fill="#ffffff"/>
    </g>
  </g>

  <!-- Cyber Pulse Nodes on the Shield Vertexes -->
  <circle cx="256" cy="60" r="7" fill="#34d399" filter="url(#neonGlow)"/>
  <circle cx="396" cy="115" r="6" fill="#34d399"/>
  <circle cx="116" cy="115" r="6" fill="#34d399"/>
  <circle cx="256" cy="430" r="7" fill="#34d399" filter="url(#neonGlow)"/>

  <!-- Dynamic Status Check Badge at Bottom -->
  <g transform="translate(256, 455)" filter="url(#neonGlow)">
    <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#10b981"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="#022c22" text-anchor="middle" letter-spacing="1">BARIDIGUARD</text>
  </g>
</svg>